<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA 지식검색 챗봇</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: #F0F2F5; height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header {
    background: #fff;
    border-bottom: 1px solid #E5E7EB;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-icon {
    width: 36px; height: 36px; background: #3B82F6;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header-title { font-size: 16px; font-weight: 700; color: #111; }
  .header-sub { font-size: 12px; color: #6B7280; margin-top: 1px; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border: none; background: #F3F4F6;
    border-radius: 8px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    color: #6B7280; transition: background .15s;
  }
  .icon-btn:hover { background: #E5E7EB; color: #111; }

  /* Chat area */
  .chat-wrap { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  /* Welcome card */
  .welcome-card {
    background: #fff; border-radius: 16px; padding: 24px;
    text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    max-width: 520px; margin: 10px auto 0; width: 100%;
  }
  .welcome-card .bot-avatar {
    width: 56px; height: 56px; background: linear-gradient(135deg, #3B82F6, #6366F1);
    border-radius: 16px; margin: 0 auto 14px; display: flex;
    align-items: center; justify-content: center; font-size: 26px;
  }
  .welcome-card h2 { font-size: 18px; font-weight: 700; color: #111; margin-bottom: 6px; }
  .welcome-card p { font-size: 13px; color: #6B7280; line-height: 1.6; margin-bottom: 18px; }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .quick-btn {
    background: #F8FAFF; border: 1.5px solid #DBEAFE; border-radius: 10px;
    padding: 10px 12px; font-size: 12px; color: #2563EB; cursor: pointer;
    text-align: left; line-height: 1.4; transition: all .15s; font-family: inherit;
  }
  .quick-btn:hover { background: #EFF6FF; border-color: #3B82F6; }
  .quick-btn .q-icon { font-size: 16px; display: block; margin-bottom: 4px; }

  /* Messages */
  .msg-row { display: flex; gap: 10px; align-items: flex-end; max-width: 680px; }
  .msg-row.user { flex-direction: row-reverse; margin-left: auto; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .msg-avatar.ai { background: linear-gradient(135deg, #3B82F6, #6366F1); }
  .msg-avatar.user { background: #E5E7EB; }
  .msg-bubble {
    padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.7;
    max-width: 480px; word-break: break-word;
  }
  .msg-bubble.ai { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-bottom-left-radius: 4px; color: #111; }
  .msg-bubble.user { background: #3B82F6; color: #fff; border-bottom-right-radius: 4px; }
  .msg-bubble table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  .msg-bubble table td { padding: 6px 14px 6px 0; font-size: 0.9em; vertical-align: top; }
  .msg-bubble table td:first-child { color: #3B82F6; font-weight: 600; white-space: nowrap; min-width: 72px; }
  .msg-time { font-size: 11px; color: #9CA3AF; margin-top: 4px; padding: 0 4px; }

  /* Sources */
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .source-tag {
    background: #F0F9FF; border: 1px solid #BAE6FD; border-radius: 20px;
    padding: 3px 10px; font-size: 11px; color: #0369A1;
  }

  /* Typing indicator */
  .typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .typing span { width: 7px; height: 7px; background: #CBD5E1; border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* Upload bar */
  .upload-bar {
    background: #EFF6FF; border: 1px dashed #93C5FD;
    border-radius: 10px; padding: 10px 16px; margin: 0 20px;
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 13px; color: #2563EB; flex-shrink: 0;
  }
  .upload-bar.show { display: flex; }
  .doc-list { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .doc-chip {
    background: #DBEAFE; border-radius: 20px; padding: 3px 10px;
    font-size: 11px; color: #1D4ED8; display: flex; align-items: center; gap: 4px;
  }
  .doc-chip button { background: none; border: none; cursor: pointer; color: #6B7280; font-size: 12px; padding: 0; line-height: 1; }

  /* Input area */
  .input-area {
    background: #fff; border-top: 1px solid #E5E7EB; padding: 14px 20px;
    display: flex; align-items: flex-end; gap: 10px; flex-shrink: 0;
  }
  .input-wrap { flex: 1; position: relative; }
  #chatInput {
    width: 100%; border: 1.5px solid #E5E7EB; border-radius: 12px;
    padding: 12px 16px; font-size: 14px; font-family: inherit;
    resize: none; outline: none; line-height: 1.5; max-height: 120px;
    transition: border-color .15s; color: #111; background: #F9FAFB;
  }
  #chatInput:focus { border-color: #3B82F6; background: #fff; }
  #chatInput::placeholder { color: #9CA3AF; }
  .send-btn {
    width: 44px; height: 44px; background: #3B82F6; border: none;
    border-radius: 12px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: background .15s; flex-shrink: 0;
  }
  .send-btn:hover { background: #2563EB; }
  .send-btn:disabled { background: #CBD5E1; cursor: default; }
  .send-btn svg { width: 18px; height: 18px; fill: #fff; }
  .attach-btn {
    width: 44px; height: 44px; background: #F3F4F6; border: none;
    border-radius: 12px; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    color: #6B7280; transition: background .15s; flex-shrink: 0;
  }
  .attach-btn:hover { background: #E5E7EB; }

  /* Modal */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 28px;
    width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 18px; color: #111; }
  .modal label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
  .modal input, .modal select {
    width: 100%; border: 1.5px solid #E5E7EB; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; font-family: inherit; outline: none;
    margin-bottom: 16px; color: #111;
  }
  .modal input:focus, .modal select:focus { border-color: #3B82F6; }
  .modal-hint { font-size: 11px; color: #9CA3AF; margin-top: -12px; margin-bottom: 16px; line-height: 1.5; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .btn-save {
    background: #3B82F6; color: #fff; border: none; border-radius: 10px;
    padding: 10px 20px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .btn-cancel {
    background: #F3F4F6; color: #374151; border: none; border-radius: 10px;
    padding: 10px 20px; font-size: 13px; cursor: pointer; font-family: inherit;
  }

  /* No docs notice */
  .no-docs-notice {
    background: #FFFBEB; border: 1px solid #FCD34D; border-radius: 10px;
    padding: 10px 14px; font-size: 12px; color: #92400E;
    margin: 0 20px; flex-shrink: 0; display: none;
  }
  .no-docs-notice.show { display: block; }

  .hl { background: #FEF08A; border-radius: 3px; padding: 0 2px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-icon">🔬</div>
    <div>
      <div class="header-title">QA 지식검색</div>
      <div class="header-sub">실험 기준 · 과거 데이터 검색</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="uploadBtn" title="문서 업로드">📎</button>
    <button class="icon-btn" id="settingsBtn" title="설정">⚙️</button>
  </div>
</div>

<!-- Upload bar -->
<div class="upload-bar" id="uploadBar">
  <span>📄</span>
  <div class="doc-list" id="docList"></div>
  <label style="cursor:pointer;font-size:12px;white-space:nowrap;color:#2563EB;font-weight:600">
    + 문서 추가
    <input type="file" id="fileInput" accept=".pdf,.txt,.docx" multiple style="display:none">
  </label>
</div>

<!-- No docs notice -->
<div class="no-docs-notice" id="noDocsNotice">
  ⚠️ 문서가 없으면 일반 답변만 가능해요. 오른쪽 상단 📎 버튼으로 기준서를 업로드해 주세요.
</div>

<!-- Chat -->
<div class="chat-wrap" id="chatWrap">
  <div class="welcome-card" id="welcomeCard">
    <div class="bot-avatar">🤖</div>
    <h2>안녕하세요! QA 지식검색입니다</h2>
    <p>기준서나 과거 실험 데이터를 업로드하면<br>궁금한 내용을 바로 찾아드려요.</p>
    <div class="quick-grid">
      <button class="quick-btn" onclick="askQuick('LPM 스크래치 기준 알려줘')">
        <span class="q-icon">🔍</span>LPM 스크래치 기준
      </button>
      <button class="quick-btn" onclick="askQuick('내마모성 시험 기준 알려줘')">
        <span class="q-icon">📋</span>내마모성 시험 기준
      </button>
      <button class="quick-btn" onclick="askQuick('스크래치 시험 합부판정 기준은?')">
        <span class="q-icon">✅</span>합부판정 기준
      </button>
      <button class="quick-btn" onclick="askQuick('최근 불합격 사례 알려줘')">
        <span class="q-icon">⚠️</span>불합격 사례
      </button>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <button class="attach-btn" id="attachBtn" title="문서 업로드">📎</button>
  <div class="input-wrap">
    <textarea id="chatInput" rows="1" placeholder="실험 기준이나 과거 데이터를 물어보세요..."></textarea>
  </div>
  <button class="send-btn" id="sendBtn">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<!-- Settings modal -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>⚙️ 설정</h3>
    <label>챗봇 이름</label>
    <input type="text" id="botNameInput" placeholder="QA 지식검색" value="QA 지식검색">
    <div class="modal-btns">
      <button class="btn-cancel" id="cancelSettings">취소</button>
      <button class="btn-save" id="saveSettings">저장</button>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// State
let docs = [];
let busy = false;
let chatHistory = [];
let apiKey = localStorage.getItem('qa_gemini_key') || '';
localStorage.removeItem('qa_model');
let model = 'gemini-2.0-flash-lite';

// Init
document.getElementById('apiKeyInput').value = apiKey;
document.getElementById('modelSelect').value = model;

// PDF 텍스트 추출
async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(s => s.str).join(' ') + '\n';
  }
  return text;
}

// 문서 업로드
async function handleFiles(files) {
  for (const file of files) {
    if (docs.find(d => d.name === file.name)) continue;
    let content = '';
    if (file.name.endsWith('.pdf')) {
      content = await extractPdfText(file);
    } else {
      content = await file.text();
    }
    docs.push({ name: file.name, content });
  }
  renderDocList();
  updateNotice();
}

function renderDocList() {
  const list = document.getElementById('docList');
  document.getElementById('uploadBar').classList.toggle('show', docs.length > 0);
  list.innerHTML = docs.map((d, i) => `
    <div class="doc-chip">
      📄 ${d.name.length > 20 ? d.name.slice(0,18)+'…' : d.name}
      <button onclick="removeDoc(${i})">✕</button>
    </div>`).join('');
}

function removeDoc(i) {
  docs.splice(i, 1);
  renderDocList();
  updateNotice();
}

function updateNotice() {
  document.getElementById('noDocsNotice').classList.toggle('show', docs.length === 0);
}

// 시간
function nowStr() {
  const d = new Date();
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

// 메시지 추가
function addMsg(role, html, sources = []) {
  const card = document.getElementById('welcomeCard');
  if (card) card.remove();

  const wrap = document.getElementById('chatWrap');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const srcHtml = sources.length
    ? `<div class="sources">${sources.map(s=>`<span class="source-tag">📄 ${s}</span>`).join('')}</div>`
    : '';

  row.innerHTML = `
    <div class="msg-avatar ${role}">${role === 'ai' ? '🤖' : '👤'}</div>
    <div>
      <div class="msg-bubble ${role}">${html}${srcHtml}</div>
      <div class="msg-time">${nowStr()}</div>
    </div>`;
  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}

function addTyping() {
  const wrap = document.getElementById('chatWrap');
  const el = document.createElement('div');
  el.className = 'msg-row ai'; el.id = 'typing';
  el.innerHTML = `<div class="msg-avatar ai">🤖</div><div class="msg-bubble ai"><div class="typing"><span></span><span></span><span></span></div></div>`;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
}

function removeTyping() {
  document.getElementById('typing')?.remove();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 키워드 하이라이트
function highlight(html, keywords) {
  if (!keywords?.length) return html;
  keywords.forEach(k => {
    if (k && k.length > 1) {
      const re = new RegExp('(' + k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
      html = html.replace(re, '<span class="hl">$1</span>');
    }
  });
  return html;
}

// API 없는 문서 검색 엔진
function localSearch(q) {
  const terms = q.toLowerCase().match(/[a-z0-9가-힣]{2,}/g) || [];

  // 문서별 점수 계산
  const scored = docs.map(doc => {
    const name = doc.name.toLowerCase();
    const text = doc.content.replace(/\s+/g, ' ');
    const lower = text.toLowerCase();
    let score = 0;
    const positions = [];
    terms.forEach(t => {
      if (name.includes(t)) score += 10;
      let p = 0;
      while ((p = lower.indexOf(t, p)) >= 0) { score += 3; positions.push(p); p++; }
    });
    return { doc, score, text, lower, positions };
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);

  if (!scored.length) {
    return {
      answer: `<span style="color:#6B7280">등록된 문서에서 <strong>"${esc(q)}"</strong>에 해당하는 내용을 찾지 못했습니다.</span>`,
      sources: []
    };
  }

  const top = scored[0];
  const { text, lower, positions, doc } = top;
  const docShort = doc.name.replace(/\.[^.]+$/, '');

  // 가장 밀집된 위치 찾기
  let bestPos = positions[0] || 0;
  if (positions.length > 1) {
    bestPos = positions.reduce((best, p) => {
      const near = positions.filter(h => Math.abs(h - p) <= 300).length;
      const bestNear = positions.filter(h => Math.abs(h - best) <= 300).length;
      return near > bestNear ? p : best;
    }, positions[0]);
  }

  // 판정기준 섹션 우선
  const jKws = ['판정기준','판정 기준','합격기준','합부판정','불합격','이상','이하'];
  for (const jk of jKws) {
    const jp = lower.indexOf(jk);
    if (jp >= 0 && Math.abs(jp - bestPos) < 2000) { bestPos = jp; break; }
  }

  // 넓은 범위 추출
  const start = Math.max(0, bestPos - 100);
  const chunk = text.slice(start, start + 800).replace(/\s+/g, ' ').trim();

  // 시험방법 번호 항목 추출
  const steps = [...chunk.matchAll(/[①②③④⑤⑥⑦⑧]\s*([^①②③④⑤⑥⑦⑧]{8,100})/g)]
    .slice(0, 6)
    .map((m, i) => `<div style="padding:3px 0">${'①②③④⑤⑥⑦⑧'[i]} ${esc(m[1].trim().slice(0, 80))}</div>`)
    .join('');

  // 핵심 수치 추출 (N, mm, %, 매 등)
  const nums = [...new Set(chunk.match(/[\d.]+\s*(N|mm|㎜|%|매|회|℃|°C|이상|이하|미만|초과)[^\s,]*/g) || [])].slice(0, 5);

  // 표 형식 항목 추출
  const fields = [
    { k:'규격',    re:/(\d+\s*[\*×x]\s*\d+)/ },
    { k:'시료매수', re:/(\d+\s*매)/ },
    { k:'합부판정', re:/([\d.]+\s*N\s*이상|변화\s*없을\s*것|이상|이하[^\s]{0,10})/ },
    { k:'시험기',   re:/(스크래치\s*시험기|SCUFF\s*시험기|내마모\s*시험기|시험기[^\s]{0,10})/ },
  ].map(f => {
    const m = chunk.match(f.re);
    return m ? { k: f.k, v: m[1].replace(/\s+/g,' ').trim() } : null;
  }).filter(Boolean);

  const tableRows = fields.map(f =>
    `<tr><td style="padding:6px 14px 6px 0;color:#3B82F6;font-weight:600;white-space:nowrap;font-size:0.88em;vertical-align:top">${f.k}</td>` +
    `<td style="padding:6px 0;font-size:0.9em"><strong>${esc(f.v)}</strong></td></tr>`
  ).join('');

  // 응답 조합
  let answer = `<div style="font-size:0.8em;color:#9CA3AF;margin-bottom:10px">📋 ${esc(docShort)}</div>`;

  if (tableRows) {
    answer += `<table style="border-collapse:collapse;width:100%;margin-bottom:${steps ? '12px' : '0'}">${tableRows}</table>`;
  }
  if (steps) {
    answer += `<div style="margin-top:8px"><div style="font-weight:600;color:#3B82F6;font-size:0.87em;margin-bottom:6px">시험방법</div>` +
      `<div style="font-size:0.88em;line-height:1.9;color:#374151">${steps}</div></div>`;
  }
  if (!tableRows && !steps) {
    // 관련 문장만 표시
    const sentences = chunk.split(/[.。]\s+/).filter(s => s.trim().length > 5).slice(0, 4);
    answer += `<div style="font-size:0.9em;line-height:1.8;color:#374151">${sentences.map(s => `• ${esc(s.trim())}`).join('<br>')}</div>`;
  }

  return { answer, sources: [doc.name] };
}

// 메인 전송
async function sendMsg(q) {
  if (!q.trim() || busy) return;
  busy = true;
  document.getElementById('sendBtn').disabled = true;

  addMsg('user', esc(q));
  addTyping();

  const ctx = docs.map(d => `[문서: ${d.name}]\n${d.content.slice(0, 8000)}`).join('\n\n---\n\n');
  const hist = chatHistory.slice(-6).map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));

  try {
    if (docs.length === 0) throw new Error('NO_DOCS');
    const result = localSearch(q);
    removeTyping();
    addMsg('ai', result.answer, result.sources);
    chatHistory.push({ role: 'user', content: q }, { role: 'assistant', content: result.answer });
  } catch (e) {
    removeTyping();
    if (e.message === 'NO_DOCS') {
      addMsg('ai', `<div style="color:#92400E;background:#FFFBEB;padding:12px 16px;border-radius:10px;font-size:0.9em">
        📎 먼저 문서를 업로드해 주세요.<br>오른쪽 상단 <strong>📎 버튼</strong>으로 기준서 PDF를 올리면 바로 검색할 수 있어요.
      </div>`);
    } else {
      addMsg('ai', `<span style="color:#EF4444">오류: ${esc(e.message)}</span>`);
    }
  }

  busy = false;
  document.getElementById('sendBtn').disabled = false;
}

function askQuick(q) {
  document.getElementById('chatInput').value = q;
  sendMsg(q);
  document.getElementById('chatInput').value = '';
}

// 이벤트
document.getElementById('sendBtn').addEventListener('click', () => {
  const val = document.getElementById('chatInput').value.trim();
  if (val) { sendMsg(val); document.getElementById('chatInput').value = ''; }
});

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const val = e.target.value.trim();
    if (val) { sendMsg(val); e.target.value = ''; }
  }
});

document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// 파일 업로드
['uploadBtn','attachBtn'].forEach(id => {
  document.getElementById(id).addEventListener('click', () => document.getElementById('fileInput').click());
});
document.getElementById('fileInput').addEventListener('change', e => handleFiles(e.target.files));

// 설정 모달
document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.add('show');
});
document.getElementById('cancelSettings').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('show');
});
document.getElementById('saveSettings').addEventListener('click', () => {
  apiKey = document.getElementById('apiKeyInput').value.trim();
  model = document.getElementById('modelSelect').value;
  localStorage.setItem('qa_gemini_key', apiKey);
  localStorage.setItem('qa_model', model);
  document.getElementById('settingsModal').classList.remove('show');
});

// 드래그 앤 드롭
const chatWrap = document.getElementById('chatWrap');
chatWrap.addEventListener('dragover', e => e.preventDefault());
chatWrap.addEventListener('drop', e => {
  e.preventDefault();
  handleFiles(e.dataTransfer.files);
});
</script>
